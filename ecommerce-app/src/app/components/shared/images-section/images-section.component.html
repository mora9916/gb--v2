<div class="relative flex flex-wrap gap-6 items-center justify-center p-4 mt-8">
    @for (card of cards; track card.title) {
        <div class="flex flex-col items-center flex-1 min-w-[250px] max-w-sm rounded-lg shadow-lg overflow-hidden img-card">
            <img [src]="card.img" [alt]="card.title" class="w-90 h-90 object-cover rounded-lg border border-amber-300"/>
            <div class="flex items-center justify-center h-20 w-full">
                <h3 class="text-2xl font-semibold">{{ card.title }}</h3>
            </div>
        </div>
    }
</div>
