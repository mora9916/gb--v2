<div class="relative w-full mx-auto">
  @if (products.length > 0) {
    <div class="overflow-hidden">
      <div class="carousel-container" [style.transform]="'translateX(-' + (currentIndex * (100 / visibleCards)) + '%)'">
        @for (product of products; track product._id) {
          <div class="carousel-item">
            <app-products-card [product]="product"></app-products-card>
          </div>
        }
      </div>
    </div>

    @if (showControls && products.length > visibleCards) {
      <button
        class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-gray-700 hover:text-gray-900 p-2 rounded-full shadow-lg transition-all duration-200 hover:scale-110 z-10"
        (click)="prevProduct()"
        [disabled]="currentIndex === 0"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <button
        class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-gray-700 hover:text-gray-900 p-2 rounded-full shadow-lg transition-all duration-200 hover:scale-110 z-10"
        (click)="nextProduct()"
        [disabled]="currentIndex >= products.length - visibleCards"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    }

    @if (showIndicators && products.length > visibleCards) {
      <div class="flex justify-center mt-4 space-x-2">
        @for (i of indicatorArray; track i) {
          <button
            class="w-3 h-3 rounded-full transition-all duration-200 {{ i === currentIndex ? 'bg-blue-500' : 'bg-gray-300' }}"
            (click)="goToProduct(i)"
          ></button>
        }
      </div>
    }
  } @else {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
      <p class="ml-4 text-gray-600">Cargando productos...</p>
    </div>
  }
</div>
